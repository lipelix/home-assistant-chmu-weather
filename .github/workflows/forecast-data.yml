name: Forecast data

# Samples the ČHMÚ ALADIN CZ_1km model at every station coordinate and publishes
# the result as a static site, so the integration downloads a few kilobytes for
# its own station instead of ~70 MB of GRIB for the whole country.
#
# ALADIN runs at 00/06/12/18 UTC, but a run does not land on opendata 75 minutes
# later as this workflow used to assume - measured on the directory listing, the
# lag is three to four and a half hours (00Z at 03:31, 06Z at 10:24, 12Z at
# 15:11, 18Z at 22:23 UTC on 2026-09-16/17) and it drifts by an hour from one
# cycle to the next, so no fixed slot can track it. The build therefore polls:
# it asks the site which run it is already serving and stops before the ~63 MB
# download when opendata has nothing newer, which makes a poll cost seconds.
#
# The polling is not scheduled here, because GitHub's scheduler cannot do it.
# Scheduled runs are delayed under load and dropped when the load is high
# enough: measured on this repository, one hourly slot delivered one firing out
# of nine, and tripling the slots changed nothing - about one firing every four
# hours either way, landing nowhere near the minute asked for. The 2026-09-17
# 12Z run sat unpublished for two hours because of it.
#
# The clock lives outside GitHub instead: a Cloudflare Worker on a cron trigger
# dispatches this workflow three times an hour. It is provisioned by Terraform
# in the private liplab-tech-infra repository (infrastructure/workers.tf).
# Cloudflare fires on time, so the lag between a run appearing on opendata and
# being served is bounded by the poll interval rather than by GitHub's queue.

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild even when the site already serves the newest run"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

# Serialise the runs so a late one cannot overwrite a newer one. Cancelling is
# deliberately off: a run interrupted between the artifact upload and the Pages
# deployment fails the deployment and can leave the site on the older artifact,
# which is worse than one wasted six minute run. A stuck run is bounded by the
# job timeout instead.
concurrency:
  group: forecast-data
  cancel-in-progress: false

jobs:
  build:
    name: Build and publish
    runs-on: ubuntu-latest
    # The whole job takes about a minute; GitHub's default would let a hung
    # download sit on the concurrency group for six hours, i.e. a whole model
    # cycle. The headroom is for the retries in build_forecast_data.py, which
    # stop retrying 20 minutes into the run for exactly this reason: a job
    # killed here publishes nothing, so the retrying has to leave enough of
    # this budget to decode and upload what it did manage to download.
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      # No third-party dependencies on purpose: tools/aladin.py decodes GRIB1
      # with the standard library only. --published-index points at the site
      # this workflow deploys to, which is the integration's FORECAST_BASE_URL
      # in custom_components/chmu/const.py; nothing is written to dist when the
      # run it names is already the newest one, so the steps below are skipped.
      - name: Build forecast data
        id: build
        env:
          FORCE: ${{ inputs.force }}
          INDEX: https://lipelix.github.io/home-assistant-chmu-weather/v1/index.json
        run: |
          set -euo pipefail
          # A forced dispatch passes no index, so the build never skips.
          if [ "${FORCE:-false}" = "true" ]; then
            INDEX=""
          fi
          python tools/build_forecast_data.py --out dist \
            ${INDEX:+--published-index "$INDEX"}
          if [ -f dist/v1/index.json ]; then
            echo "built=true" >> "$GITHUB_OUTPUT"
          else
            echo "built=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure Pages
        if: steps.build.outputs.built == 'true'
        uses: actions/configure-pages@v6

      - name: Upload artifact
        if: steps.build.outputs.built == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Deploy to Pages
        id: deploy
        if: steps.build.outputs.built == 'true'
        uses: actions/deploy-pages@v5
