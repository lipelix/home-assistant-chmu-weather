name: CI

# A push to a branch that has an open pull request used to run this workflow
# twice, once per event. Pushes are therefore limited to main, which is the
# only branch where a push is not already covered by the pull_request event.
on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "0 0 * * *"

# Superseding a pull request with a new push makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install ruff
        # Pinned via requirements-dev.txt - an unpinned ruff picks up new
        # default rules on every release and breaks CI without a code change.
        run: python -m pip install "$(grep '^ruff==' requirements-dev.txt)"
      - name: Run ruff
        run: ruff check .
      - name: Check formatting
        run: ruff format --check .

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python
        # Home Assistant 2026.2 requires 3.13; the lint job stays on the
        # oldest version the integration itself supports.
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run pytest
        run: pytest

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Hassfest validation
        uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: HACS Action
        uses: hacs/action@main
        with:
          category: integration
